<title>Seedance 提示詞庫</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    /* light — cream & white with coffee accent */
    --bg:#f4efe7; --card:#fffdf9; --card2:#efe7da; --border:#e4d9c7;
    --text:#3b2f26; --sub:#8a7a68; --faint:#bcac96;
    --accent:#6f4e37; --accent-ink:#fdf8f1;
    --chip-bg:#e8dcc9; --chip-ink:#5c4632;
    --ok:#5c7c53; --warn:#b7793a; --danger:#bd4d3d;
    --overlay:rgba(40,30,20,.5); --shadow:0 1px 3px rgba(60,40,20,.08);
  }
  :root[data-theme="dark"]{
    --bg:#1c1712; --card:#26201a; --card2:#2e271f; --border:#3d3427;
    --text:#efe6d8; --sub:#a99a85; --faint:#6d6151;
    --accent:#c69c6d; --accent-ink:#231a10;
    --chip-bg:#392e21; --chip-ink:#dcc29c;
    --ok:#8faf7e; --warn:#d3a25f; --danger:#e07a68;
    --overlay:rgba(0,0,0,.66); --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1712; --card:#26201a; --card2:#2e271f; --border:#3d3427;
      --text:#efe6d8; --sub:#a99a85; --faint:#6d6151;
      --accent:#c69c6d; --accent-ink:#231a10;
      --chip-bg:#392e21; --chip-ink:#dcc29c;
      --ok:#8faf7e; --warn:#d3a25f; --danger:#e07a68;
      --overlay:rgba(0,0,0,.66); --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  button,input,textarea,select{font-family:inherit}
  button{cursor:pointer}

  .wrap{max-width:900px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}

  header{
    position:sticky;top:0;z-index:30;background:var(--bg);
    padding:16px 14px 10px;margin:0 -14px;border-bottom:1px solid var(--border);
  }
  header .inner{max-width:900px;margin:0 auto}
  .titlerow{display:flex;align-items:baseline;gap:10px}
  .titlerow h1{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:.4px}
  .titlerow h1 .dot{color:var(--accent)}
  .titlerow .count{color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums}
  .iconbtn{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:9px;padding:5px 10px;font-size:.78rem;white-space:nowrap}
  .iconbtn:active{transform:scale(.96)}

  .subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;flex-wrap:wrap}
  .actions{display:flex;gap:7px;flex-shrink:0}
  .sync{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;font-size:.76rem;color:var(--sub)}
  .sync>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot-ok{background:var(--ok)} .dot-warn{background:var(--warn)} .dot-off{background:var(--faint)}
  .sync button{background:none;border:none;color:var(--accent);font-size:.76rem;padding:2px 4px}

  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:3px;margin-top:11px;gap:2px}
  .seg button{border:none;background:none;color:var(--sub);font-size:.86rem;padding:7px 16px;border-radius:8px;font-weight:500}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

  .search{display:flex;align-items:center;gap:8px;margin-top:11px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 13px}
  .search input{border:none;background:none;outline:none;flex:1;font-size:1rem;color:var(--text)}
  .search input::placeholder{color:var(--faint)}

  .tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tagbar .tag{font-size:.78rem;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--sub);user-select:none}
  .tagbar .tag.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tagbar .tag .c{opacity:.6;font-size:.7rem;margin-left:3px}
  .tagbar .clear{color:var(--sub);text-decoration:underline;font-size:.76rem;padding:4px 2px;background:none;border:none}

  main{padding-top:14px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  @media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;position:relative}
  .card:active{transform:scale(.985)}
  .thumbwrap{position:relative}
  .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--card2);display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:.78rem;padding:10px;text-align:center}
  .badge{position:absolute;top:8px;left:8px;font-size:.68rem;padding:2px 8px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(3px)}
  .cbody{padding:10px 11px 12px}
  .cbody .p{font-size:.84rem;color:var(--text);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ctags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .ctags span{font-size:.68rem;color:var(--chip-ink);background:var(--chip-bg);padding:2px 8px;border-radius:11px}
  .empty{color:var(--sub);text-align:center;padding:56px 18px;font-size:.92rem;line-height:1.8}

  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:28px;line-height:1;box-shadow:0 5px 16px rgba(0,0,0,.3);z-index:40;display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}
  .fab2{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));height:44px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--accent);border:1px solid var(--accent);font-size:.86rem;font-weight:600;box-shadow:var(--shadow);z-index:40;display:flex;align-items:center;gap:6px}
  .fab2:active{transform:scale(.96)}

  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .overlay.top{z-index:60}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.sheet{border-radius:18px}}
  .sheet h2{font-size:1.05rem;margin:0 0 14px}
  .sheet .big{width:100%;max-height:52vh;object-fit:contain;background:#000;border-radius:12px;display:block}
  .sheet .bigph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:var(--faint);background:var(--card2);border-radius:12px;font-size:.85rem}
  .meta{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:.78rem;margin:12px 2px 8px}
  .meta a{color:var(--accent)}
  .meta .kind{color:var(--chip-ink);background:var(--chip-bg);padding:2px 9px;border-radius:11px}
  .promptbox{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:.95rem;line-height:1.75;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
  .stags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .stags span{font-size:.78rem;color:var(--chip-ink);background:var(--chip-bg);padding:4px 10px;border-radius:14px}
  .note{margin-top:12px;color:var(--sub);font-size:.86rem;border-left:2px solid var(--border);padding-left:11px;white-space:pre-wrap}
  .flabel{font-weight:600;font-size:.92rem;margin:16px 0 7px}
  .fdna{font-size:.88rem;line-height:1.85;color:var(--text)}
  .fdna b{color:var(--accent)}
  .discrow{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:14px;cursor:pointer}
  .discrow input{width:19px;height:19px;flex:0 0 auto;accent-color:var(--accent)}
  .snipwrap{margin:-6px 0 14px}
  .sniprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
  .snipg{font-size:.72rem;color:var(--sub);min-width:40px}
  .snip,.subj{font-size:.78rem;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--accent)}
  .snip:active,.subj:active{transform:scale(.95)}
  .row{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:.95rem;font-weight:600}
  .btn:active{transform:scale(.98)}
  .btn.copied{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ghost{background:var(--card);color:var(--sub);border-color:var(--border);flex:0 0 auto;font-weight:500}
  .btn.danger{background:var(--card);color:var(--danger);border-color:var(--border);flex:0 0 auto;font-weight:500}

  .field{margin-bottom:13px;position:relative}
  .field label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:5px}
  .field textarea,.field input[type=text],.field input[type=date],.field input[type=url]{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;outline:none}
  .field textarea{min-height:120px;resize:vertical;line-height:1.7}
  .field textarea:focus,.field input:focus{border-color:var(--accent)}
  .typepick{display:flex;gap:8px}
  .typepick button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:.92rem;font-weight:500}
  .typepick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .imgpick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--border);border-radius:12px;padding:16px;background:var(--card2);color:var(--sub);font-size:.9rem}
  .imgprev{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .imgprev img{width:100%;max-height:220px;object-fit:contain;background:#000;display:block}
  .imgprev .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:.8rem}
  input[type=file]{display:none}

  .tagedit{display:flex;flex-wrap:wrap;gap:6px}
  .tagedit .t{font-size:.8rem;padding:5px 11px;border-radius:16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:5px}
  .tagedit .t .rm{opacity:.8;font-weight:700}
  .taginput{display:flex;gap:8px;margin-top:8px}
  .taginput input{flex:1;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;outline:none}
  .taginput button{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:10px;padding:0 14px;font-size:.9rem;white-space:nowrap}
  .hint{font-size:.76rem;color:var(--sub);margin-top:6px;line-height:1.6}
  .phrasebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .phrasechip{font-size:.8rem;padding:6px 12px;border-radius:14px;border:1px dashed var(--accent);background:var(--card2);color:var(--accent);text-align:left;max-width:100%;font-weight:600}
  .phrasechip:active{transform:scale(.97)}
  .buildbtn{width:100%;margin-top:2px;border:1px dashed var(--accent);background:var(--card2);color:var(--accent);border-radius:10px;padding:11px;font-size:.9rem;font-weight:600}

  /* builder */
  .bgroup{margin-bottom:14px}
  .bgroup>.lab{font-size:.78rem;color:var(--sub);margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{font-size:.82rem;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text)}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .preview{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:.92rem;line-height:1.7;color:var(--text);min-height:52px;white-space:pre-wrap}
  .preview.empty-p{color:var(--faint)}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.85rem;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88vw;text-align:center}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <div class="inner">
      <div class="titlerow">
        <h1>Seedance 提示詞庫<span class="dot">.</span></h1>
        <span class="count" id="count"></span>
      </div>
      <div class="subrow">
        <div class="sync" id="syncBar">
          <span id="syncLabel"><span class="dot dot-off"></span>啟動中…</span>
          <button id="btnRefresh" style="display:none">🔄 重新載入</button>
        </div>
        <div class="actions">
          <button class="iconbtn" id="btnExport" title="匯出備份">⬇ 匯出</button>
          <button class="iconbtn" id="btnImport" title="匯入備份">⬆ 匯入</button>
          <button class="iconbtn" id="btnDebug" title="除錯訊息">🐛 除錯</button>
        </div>
      </div>
      <div class="seg" id="typeSeg">
        <button data-t="all" class="on">全部</button>
        <button data-t="video">🎬 影片</button>
        <button data-t="image">🖼 圖片</button>
      </div>
      <div class="search">
        <span>🔍</span>
        <input type="text" id="search" placeholder="搜尋提示詞或標籤…" autocomplete="off">
      </div>
      <div class="tagbar" id="tagbar"></div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"></div>
  </main>
</div>

<button class="fab2" id="btnBuilder" aria-label="提示詞產生器">🧩 產生器</button>
<button class="fab" id="btnAdd" aria-label="新增提示詞">＋</button>
<div id="modalArea"></div>

<script>
(function(){
  "use strict";

  /* ---------- on-screen debug log: mirrors console.log/warn/error into a visible
     panel, since mobile viewers have no way to open browser devtools ---------- */
  var DEBUG_LOG=[];
  var MAX_DEBUG_LINES=300;
  (function wrapConsole(){
    ['log','warn','error'].forEach(function(level){
      var orig=console[level].bind(console);
      console[level]=function(){
        var args=Array.prototype.slice.call(arguments);
        var line=args.map(function(a){
          if(a===undefined)return 'undefined';
          if(a===null)return 'null';
          if(typeof a==='object'){try{return JSON.stringify(a);}catch(e){return String(a);}}
          return String(a);
        }).join(' ');
        var t=new Date();
        function z(n){return (n<10?'0':'')+n;}
        var ts=z(t.getHours())+':'+z(t.getMinutes())+':'+z(t.getSeconds())+'.'+(t.getMilliseconds()+'').padStart(3,'0');
        DEBUG_LOG.push('['+ts+'] ['+level+'] '+line);
        if(DEBUG_LOG.length>MAX_DEBUG_LINES)DEBUG_LOG.shift();
        orig.apply(console,args);
      };
    });
  })();
  window.addEventListener('error',function(e){
    console.error('[uncaught]',e.message,'at',e.filename+':'+e.lineno);
  });
  window.addEventListener('unhandledrejection',function(e){
    console.error('[unhandled promise rejection]',e.reason&&e.reason.message?e.reason.message:JSON.stringify(e.reason));
  });

  /* ---------- storage: localStorage (synchronous — cannot be interrupted mid-write
     by a tab close the way an async IndexedDB transaction's callback can) ---------- */
  var LS_KEY='seedance-db-v2';
  function lsGet(){
    try{
      var raw=localStorage.getItem(LS_KEY);
      return raw?JSON.parse(raw):null;
    }catch(e){
      console.error('[ls] read error:',e);
      return null;
    }
  }
  function lsSet(v){
    try{
      localStorage.setItem(LS_KEY,JSON.stringify(v));
      return true;
    }catch(e){
      console.error('[ls] write error (quota exceeded?):',e);
      return false;
    }
  }
  /* ---------- legacy storage: old IndexedDB store, kept ONLY as a one-time
     migration source so nothing already saved there gets lost ---------- */
  var IDB_NAME='seedance-db', IDB_STORE='kv', IDB_KEY='data';
  function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=function(){r.result.createObjectStore(IDB_STORE);};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
  function idbGet(){return idbOpen().then(function(db){return new Promise(function(res){try{var tx=db.transaction(IDB_STORE,'readonly');var g=tx.objectStore(IDB_STORE).get(IDB_KEY);g.onsuccess=function(){res(g.result||null);};g.onerror=function(){res(null);};}catch(e){res(null);}});}).catch(function(){return null;});}

  /* ---------- data ---------- */
  var data={ version:2, prompts:[] };
  var query='', activeTags=new Set(), viewType='all';

  function normalize(){
    data.prompts.forEach(function(p){ if(p.type!=='image') p.type=p.type||'video'; });
  }

  /* ---------- auto-tag dictionary ---------- */
  var TAG_RULES=[
    /* —— 主題 / 內容(優先,排最前面) —— */
    ['vlog',['vlog','日常','一天的生活','生活紀錄','生活记录','記錄一天','记录一天','紀錄一天']],
    ['沉浸感',['沉浸感','第一人稱','第一人称','沉浸']],
    ['直式9:16',['9:16','直式','豎屏','竖屏','直幅']],
    ['橫式16:9',['16:9','橫式','橫屏','宽屏','寬屏']],
    ['多場景',['包含起床','一整天','記錄一天','记录一天','多個場景','多个场景','分鏡','分镜','一天的生活','首先','然後','然后','镜头 2','鏡頭 2','镜头2','鏡頭2']],
    ['魔法',['魔法','咒語','咒语','施法','魔杖','遺忘咒','遗忘咒','obliviate','魔藥','魔药','巫術','巫术']],
    ['奇幻',['奇幻','魔幻','fantasy','異世界','异世界']],
    ['霍格華茲',['霍格','hogwarts','魔法學校','魔法学校']],
    ['哈利波特',['哈利波特','harry potter','雷文克勞','雷文克劳','葛萊分多','格兰芬多','史萊哲林','斯莱特林','赫夫帕夫','赫奇帕奇','巫師','巫师','女巫','掃帚','扫帚']],
    ['迪士尼',['迪士尼','disney','迪斯尼']],
    ['樂園',['樂園','乐园','主題樂園','主题乐园','遊樂園','游乐园','遊樂設施','游乐设施','園區','园区']],
    ['雲霄飛車',['雲霄飛車','云霄飞车','過山車','过山车','雲宵飛車']],
    ['煙火',['煙火','烟火','煙花','烟花','焰火']],
    ['公主',['公主','睡美人','白雪公主','灰姑娘','人魚公主','美人鱼']],
    ['城堡',['城堡']],
    ['拍照',['拍照','自拍','合照','合影','打卡']],
    ['化妝',['化妝','化妆','妝容','妆容','美妝','美妆','上妝','上妆']],
    ['旅遊',['旅遊','旅游','出遊','出游','景點','景点','之旅','攻略','旅行','打卡']],
    ['校園',['校園','校园','學院','学院','上課','上课','教室','走廊','同學','同学','學生','学生']],
    ['用餐',['吃飯','吃饭','用餐','大廳','大厅','餐廳','餐厅','食堂']],

  /* ---------- image compression ---------- */
  function compressImage(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){URL.revokeObjectURL(url);var maxDim=440,w=img.naturalWidth,h=img.naturalHeight;var s=Math.min(1,maxDim/Math.max(w,h));var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));var c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);try{res(c.toDataURL('image/jpeg',0.62));}catch(e){rej(e);}};
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('讀取圖片失敗'));};
      img.src=url;
    });
  }
  /* Re-compress an already-local dataURL down to a tiny thumbnail, specifically
     for the Drive-synced copy (kept separate from the full-quality local
     `image` so on-device display stays sharp while the synced copy stays
     small no matter how large the original capture was). */
  function shrinkForSync(dataUrl,maxDim,quality){
    return new Promise(function(res){
      if(!dataUrl){res('');return;}
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        var s=Math.min(1,maxDim/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var c=document.createElement('canvas');c.width=cw;c.height=ch;
        c.getContext('2d').drawImage(img,0,0,cw,ch);
        try{res(c.toDataURL('image/jpeg',quality));}catch(e){res('');}
      };
      img.onerror=function(){res('');};
      img.src=dataUrl;
    });
  }

  /* Synchronous on purpose: by the time this call returns, the write has
     already landed — nothing async left in flight that a tab close could cut
     off mid-way, unlike the previous IndexedDB-based persist(). */
  function persist(skipSync){
    console.log('[persist] called with',data.prompts.length,'prompts, skipSync=',!!skipSync);
    var ok=lsSet(data);
    if(!ok){
      console.warn('[ls] save failed — likely storage quota exceeded');
      toast('⚠ 本機儲存空間不足,建議先「⬇ 匯出」備份');
    }else{
      /* read back immediately to prove the write actually landed, not just that setItem didn't throw */
      var verify=lsGet();
      var verifyLen=verify&&verify.prompts?verify.prompts.length:-1;
      console.log('[persist] verify read-back: ',verifyLen,'prompts in localStorage (expected',data.prompts.length,')');
      if(verifyLen!==data.prompts.length){
        console.error('[persist] MISMATCH! write did not actually persist correctly');
        toast('⚠ 本機儲存驗證失敗,請截圖 Console 給開發者看');
      }
    }
    render();
    if(!skipSync) scheduleDriveSave();
  }

  function buildTagbar(){
    var counts={};
    data.prompts.filter(inType).forEach(function(p){(p.tags||[]).forEach(function(t){counts[t]=(counts[t]||0)+1;});});
    // 平常不顯示標籤;只顯示「已選的標籤」+「搜尋時符合關鍵字的標籤」,保持首頁乾淨
    var show=[];
    activeTags.forEach(function(t){ if(show.indexOf(t)===-1) show.push(t); });
    if(query){
      Object.keys(counts).filter(function(t){ return !activeTags.has(t) && t.toLowerCase().indexOf(query)!==-1; })
        .sort(function(a,b){ return counts[b]-counts[a]; }).forEach(function(t){ show.push(t); });
    }
    tagbar.innerHTML='';
    tagbar.style.display=show.length?'flex':'none';
    if(!show.length) return;
    show.forEach(function(t){
      var b=document.createElement('button');b.className='tag'+(activeTags.has(t)?' on':'');
      b.innerHTML=esc(t)+'<span class="c">'+(counts[t]||0)+'</span>';
      b.onclick=function(){
        if(activeTags.has(t)){ activeTags.delete(t); }
        else { activeTags.add(t); query=''; searchEl.value=''; }
        render();
      };
      tagbar.appendChild(b);
    });
    if(activeTags.size){var c=document.createElement('button');c.className='clear';c.textContent='清除篩選';c.onclick=function(){activeTags.clear();render();};tagbar.appendChild(c);}
  }

  function assembleFree(sel){
    var subject=(sel.subject||'').trim(),action=(sel.action||'').trim(),seg=[];
    var head=subject; if(action)head=head?head+'，'+action:action; if(head)seg.push(head);
    if(sel['運鏡'][0])seg.push('鏡頭'+(CAMERA[sel['運鏡'][0]]||sel['運鏡'][0]));

    var tail=[]; if(sel['風格'].length)tail.push(sel['風格'].join('、')); if(sel['畫質'][0])tail.push(sel['畫質'][0]);

    '</div>';
    document.body.appendChild(d);
    d.onclick=function(e){if(e.target===d)d.remove();};
    d.querySelector('#dbgClose').onclick=function(){d.remove();};
    d.querySelector('#dbgClear').onclick=function(){DEBUG_LOG.length=0;toast('已清空');d.remove();};
    d.querySelector('#dbgCopy').onclick=function(){copyText(text,this);};
    // auto-scroll the textarea to the bottom so the newest lines are visible
    var ta=d.querySelector('#dbgText');ta.scrollTop=ta.scrollHeight;
  };

  function mergePrompts(a,b){
    var m=new Map();
    (a||[]).forEach(function(p){
      if(p&&p.id)m.set(p.id,p);
    });
    var merged=0,kept=0;
    (b||[]).forEach(function(p){
      if(!p||!p.id)return;
      var e=m.get(p.id);
      if(!e||(p.updatedAt||0)>=(e.updatedAt||0)){
        /* The remote copy's image (if any) is always a small sync thumbnail
           (see saveToDrive/shrinkForSync) — never better than a full-quality
           image already captured on this device. Keep the local one. */
        if(e&&e.image)p=Object.assign({},p,{image:e.image});
        m.set(p.id,p);
        merged++;
      }else{
        kept++;
      }
    });
    console.log('[merge] result:', m.size, 'items (merged:', merged, 'kept:', kept, ')');
    return Array.from(m.values());
  }

  /* ---------- Google Drive sync ---------- */
  var DRIVE_STEM='seedance-prompts-data', DRIVE_FOLDER_NAME='Seedance提示詞_同步資料';
  function stampedName(stem){var d=new Date();function z(n){return (n<10?'0':'')+n;}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+'-'+z(d.getMinutes())+'-'+z(d.getSeconds())+' '+stem+'.json';}
  /* Drive uploads exclude images entirely (see saveToDrive) — screenshots are
     kept local-only. Every save otherwise creates a brand new file (this
     connector has no update/delete tool), so with images included the
     folder had accumulated 50+ near-duplicate ~1MB files and new saves
     started failing outright (upstream_error / "request failed (400)"),
     most likely a payload-size ceiling on the artifact's MCP bridge itself
     rather than anything about the Google account's storage quota. Dropping
     images keeps every future upload in the tens-of-KB range. */
  var driveServer=null,driveFolderId=null,driveState='checking',driveBusy=false,driveDirty=false,lastSyncedAt=null,driveSaveTimer=null;

  function renderSyncUI(){
    var label=$('#syncLabel'),refresh=$('#btnRefresh');
    var map={
      checking:['dot-off','檢查雲端連線中…'],
      no_mcp:['dot-warn','⚠ 此環境無法使用 Google Drive 同步'],
      not_connected:['dot-warn','☁ 未連接 Google Drive,僅存本機'],
      needs_reauth:['dot-warn','⚠ Google Drive 需要重新授權'],
      selection_required:['dot-warn','⚠ 請選擇要用的 Google Drive 帳號'],
      sync_error:['dot-warn','⚠ 雲端同步暫時失敗,仍存本機'],
      ready:['dot-ok',driveBusy?'☁ 同步中…':(driveDirty?'☁ 即將同步…':('☁ 已同步'+(lastSyncedAt?' '+new Date(lastSyncedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'')))]
    };
    var m=map[driveState]||map.checking;
    label.innerHTML='<span class="dot '+m[0]+'"></span>'+m[1];
    refresh.style.display=(driveState!=='checking')?'inline-block':'none';
  }
  function b64ToUtf8(b64){var bin=atob(b64),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}

  function driveDiscover(){
    console.log('[drive] discover: checking window.claude...');
    if(!window.claude){
      console.error('[drive] window.claude not found');
      driveState='no_mcp';
      renderSyncUI();
      return Promise.resolve(false);
    }
    console.log('[drive] window.claude exists, checking .mcp...');
    if(!window.claude.mcp){
      console.error('[drive] window.claude.mcp not found');
      driveState='no_mcp';
      renderSyncUI();
      return Promise.resolve(false);
    }
    console.log('[drive] calling listTools()...');
    return window.claude.mcp.listTools().then(function(res){
      console.log('[drive] listTools response:', res);
      var servers=res.servers||[];
      console.log('[drive] found', servers.length, 'servers');
      servers.forEach(function(s,i){
        console.log('[drive] server', i, ':', s.server, '- tools:', (s.tools||[]).map(function(t){return t.name;}).join(', '));
      });
      var srv=servers.find(function(s){
        var n=(s.tools||[]).map(function(t){return t.name;});
        return n.indexOf('create_file')!==-1&&n.indexOf('search_files')!==-1;
      });
      if(!srv){
        console.error('[drive] no Google Drive server found');
        driveState='not_connected';
        renderSyncUI();
        return false;
      }
      console.log('[drive] found server:', srv.server, 'authStatus:', srv.authStatus);
      if(srv.authStatus==='needs_reauth'){
        console.warn('[drive] needs reauth');
        driveState='needs_reauth';
        renderSyncUI();
        return false;
      }
      driveServer=srv.server;
      console.log('[drive] set driveServer to:', driveServer);
      driveState='ready';
      renderSyncUI();
      return ensureFolder().then(function(){
        console.log('[drive] ensureFolder done');
        return true;
      });
    }).catch(function(err){
      console.error('[drive] discover error:', err);
      driveState=(err&&err.code==='selection_required')?'selection_required':'sync_error';
      renderSyncUI();
      return false;
    });
  }
  function ensureFolder(){
    return window.claude.mcp.callTool(driveServer,'search_files',{query:"title = '"+DRIVE_FOLDER_NAME+"' and mimeType = 'application/vnd.google-apps.folder'",pageSize:10}).then(function(res){
      var files=(res.payload&&res.payload.files)||[];
      if(files.length){driveFolderId=files[0].id;return;}
      return window.claude.mcp.callTool(driveServer,'create_file',{title:DRIVE_FOLDER_NAME,contentMimeType:'application/vnd.google-apps.folder'}).then(function(c){driveFolderId=c.payload&&c.payload.id;});
    }).catch(function(){driveFolderId=null;});
  }
  function findLatest(){
    var files=[],pageToken;
    function page(i){return window.claude.mcp.callTool(driveServer,'search_files',{query:"title contains '"+DRIVE_STEM+"'",pageSize:100,pageToken:pageToken}).then(function(res){var batch=(res.payload&&res.payload.files)||[];files=files.concat(batch);pageToken=res.payload&&res.payload.nextPageToken;if(pageToken&&i<10)return page(i+1);});}
    return page(0).then(function(){if(!files.length)return null;files.sort(function(a,b){return new Date(b.createdTime)-new Date(a.createdTime);});return files[0];});
  }
  function loadFromDrive(){
    if(driveState!=='ready')return Promise.resolve(false);
    driveBusy=true;renderSyncUI();
    return findLatest().then(function(latest){
      if(!latest){
        console.log('[drive] no files found');
        return false;
      }
      console.log('[drive] loading latest:', latest.title);
      return window.claude.mcp.callTool(driveServer,'download_file_content',{fileId:latest.id}).then(function(dl){
        var b64=dl.payload&&dl.payload.content;
        if(!b64){
          console.warn('[drive] no content in download');
          return false;
        }
        try{
          var remote=JSON.parse(b64ToUtf8(b64));
          var rp=Array.isArray(remote)?remote:(remote.prompts||[]);
          var before=JSON.stringify(data.prompts);
          console.log('[drive] merging: local has',data.prompts.length,'prompts, remote has',rp.length,'prompts');
          data.prompts=mergePrompts(data.prompts,rp);
          console.log('[drive] after merge: data.prompts.length =',data.prompts.length);
          normalize();
          lastSyncedAt=Date.now();
          lsSet(data);
          render();
          if(JSON.stringify(data.prompts)!==before&&JSON.stringify(data.prompts)!==JSON.stringify(rp))scheduleDriveSave();
          return true;
        }catch(e){
          console.error('[drive] parse/merge error:', e);
          return false;
        }
      });
    }).catch(function(e){
      console.error('[drive] load error:', e);
      driveState='sync_error';
      return false;
    }).then(function(r){
      driveBusy=false;
      renderSyncUI();
      return r;
    });
  }
  var SYNC_THUMB_DIM=300, SYNC_THUMB_Q=0.55; /* even at ~100 images this stays well under the ~1MB payload ceiling we hit before */
  function saveToDrive(){
    if(driveState!=='ready'||!driveDirty){
      console.log('[drive] saveToDrive skip: state='+driveState+' dirty='+driveDirty);
      return;
    }
    if(!window.claude||!window.claude.mcp){
      console.error('[drive] window.claude.mcp not available during save!');
      driveState='no_mcp';
      driveBusy=false;
      renderSyncUI();
      return;
    }
    console.log('[drive] saveToDrive start...');
    driveBusy=true;
    renderSyncUI();
    var filename=stampedName(DRIVE_STEM);
    var promptsSnapshot=data.prompts.slice();
    /* Shrink every image down to a tiny thumbnail for the synced copy —
       local storage keeps the full-quality one untouched. */
    Promise.all(promptsSnapshot.map(function(p){
      return shrinkForSync(p.image,SYNC_THUMB_DIM,SYNC_THUMB_Q).then(function(thumb){
        return {id:p.id,type:p.type||'video',prompt:p.prompt,tags:p.tags||[],image:thumb,createdAt:p.createdAt,updatedAt:p.updatedAt};
      });
    })).then(function(slimPrompts){
      var body=JSON.stringify({version:data.version||2,prompts:slimPrompts});
      console.log('[drive] uploading as:', filename, 'size:', body.length, 'bytes (images shrunk to thumbnails)');
      var req={title:filename,textContent:body,contentMimeType:'application/json',disableConversionToGoogleType:true};
      if(driveFolderId)req.parentId=driveFolderId;
      console.log('[drive] callTool(', driveServer, ', create_file, ...)');
      return window.claude.mcp.callTool(driveServer,'create_file',req);
    }).then(function(res){
      console.log('[drive] save success, response:', res);
      driveDirty=false;
      lastSyncedAt=Date.now();
      saveRetryCount=0;
    }).catch(function(err){
      console.error('[drive] save error:', err, 'code:', err&&err.code, 'message:', err&&err.message, 'retryable:', err&&err.retryable);
      driveDirty=true; /* keep pending until it actually succeeds */
      var code=err&&err.code;
      /* Only codes that truly cannot succeed without viewer action get a visible
         warning state. Everything else (network hiccups, tool_error, timeouts,
         rate limits...) is transient — stay 'ready' and quietly retry on the
         next edit or the background sweep, same as our other working sync app. */
      if(code==='needs_reauth'){
        driveState='needs_reauth';
      } else if(code==='server_not_connected'){
        driveState='not_connected';
      } else if(code==='selection_required'){
        driveState='selection_required';
      } else if(code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){
        driveState='no_mcp';
      } else {
        console.log('[drive] transient error, staying "ready" — will retry quietly');
      }
      /* per contract: only auto-retry errors explicitly stamped retryable, at most once, after a short delay */
      if(err&&err.retryable&&saveRetryCount<3){
        saveRetryCount++;
        var delay=err.retryAfterMs||4000;
        console.log('[drive] retryable error, retry #'+saveRetryCount+' in '+delay+'ms');
        clearTimeout(driveSaveTimer);
        driveSaveTimer=setTimeout(saveToDrive,delay);
      } else {
        saveRetryCount=0;
      }
    }).then(function(){
      driveBusy=false;
      renderSyncUI();
    });
  }
  var saveRetryCount=0;
  /* Kept short on purpose: other devices (e.g. the mobile app) only ever see
     new content via Drive, since each device/webview has its own separate
     local storage. A short delay here (instead of batching for longer)
     shrinks the window where a phone reopened right after a web edit would
     still see the old cloud snapshot. */
  function scheduleDriveSave(){
    driveDirty=true;
    renderSyncUI();
    if(driveState!=='ready'&&driveState!=='sync_error')return;
    clearTimeout(driveSaveTimer);
    driveSaveTimer=setTimeout(saveToDrive,400);
  }
  /* Safety net: if a save failed and the viewer doesn't edit again, driveDirty
     would otherwise sit unsynced forever. Quietly sweep every 30s and retry —
     this is what makes transient failures self-heal without any visible error. */
  setInterval(function(){
    if(driveState==='ready'&&driveDirty&&!driveBusy){
      console.log('[drive] background sweep: retrying pending save');
      saveToDrive();
    }
  },30000);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){
      clearTimeout(driveSaveTimer);
      if(driveDirty){
        console.log('[sync] visibility hidden, saving now');
        saveToDrive();
      }
    }
  });
  window.addEventListener('pagehide',function(){
    clearTimeout(driveSaveTimer);
    if(driveDirty){
      console.log('[sync] pagehide, saving now');
      saveToDrive();
    }
  });
  window.addEventListener('beforeunload',function(){
    clearTimeout(driveSaveTimer);
    if(driveDirty){
      console.log('[sync] beforeunload, saving now');
      saveToDrive();
    }
  });
  $('#btnRefresh').onclick=function(){
    console.log('[sync] manual refresh requested, current state:', driveState);
    if(driveState==='ready'){
      loadFromDrive().then(function(){
        if(driveDirty)saveToDrive();
      });
      return;
    }
    /* any non-ready state: this is a fresh user gesture, safe to retry discovery + a pending save */
    saveRetryCount=0;
    driveDiscover().then(function(ok){
      if(ok){
        toast('已重新連接 Google Drive');
        return loadFromDrive().then(function(){
          if(driveDirty)saveToDrive();
        });
      }else{
        toast('Google Drive 仍未連接,請檢查授權設定');
      }
    });
  };

  /* ---------- boot ---------- */
  function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r('__timeout');},ms);})]);}

  /* One-time migration: earlier versions of this app stored data in an async
     IndexedDB store, which could lose a just-added record if the tab closed
     before the write finished. New saves go to localStorage (synchronous —
     see persist()). On first boot after this change, pull over anything
     still sitting in the old store so nothing already saved gets lost. */
  function loadLocal(){
    var ls=lsGet();
    if(ls&&ls.prompts&&ls.prompts.length){
      console.log('[boot] loaded', ls.prompts.length, 'prompts from localStorage');
      return Promise.resolve(ls);
    }
    console.log('[boot] localStorage empty, checking legacy IndexedDB store...');
    return withTimeout(idbGet(),1500).then(function(saved){
      if(saved&&saved!=='__timeout'&&saved.prompts&&saved.prompts.length){
        console.log('[migrate] found', saved.prompts.length, 'prompts in old IndexedDB store, copying to localStorage');
        lsSet(saved);
        return saved;
      }
      return ls||{version:2,prompts:[]};
    });
  }

  render();renderSyncUI();
  loadLocal().then(function(loaded){
    data=loaded||{version:2,prompts:[]};
    normalize();
    render();
  }).then(function(){
    driveBusy=false;
    driveDirty=false;
    return driveDiscover();
  }).then(function(ok){
    if(ok){
      console.log('[boot] Google Drive ready, loading from Drive...');
      return loadFromDrive();
    }else{
      console.log('[boot] Google Drive not ready');
    }
  }).catch(function(e){
    console.error('[boot] error:', e);
  });

})();
</script>
